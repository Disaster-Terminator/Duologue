name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checks:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check generated extension output
        run: pnpm run check:generated

      - name: Unit tests
        run: pnpm test

      - name: Package extension zip
        run: |
          cd dist
          zip -r ../chatgpt-tab-bridge-extension.zip extension

      - name: Upload extension directory
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-tab-bridge-extension
          path: dist/extension
          if-no-files-found: error

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-tab-bridge-extension-zip
          path: chatgpt-tab-bridge-extension.zip
          if-no-files-found: error
